name: Verify release build

# Proves that a version tag still compiles on a clean macOS runner.
#
# This workflow does NOT produce the release artifact. The signing key that
# preserves the Accessibility grant deliberately does not live in Actions, so
# anything CI builds can only be ad-hoc signed — and an ad-hoc release is
# exactly what reset the grant for every user on every update (issue #7): its
# designated requirement is the cdhash of the binary, which changes with each
# build.
#
# The release .dmg is built, signed and uploaded LOCALLY by the maintainer:
#
#   ./tools/make-dist.sh                       # refuses to package ad-hoc
#   gh release create vX.Y.Z --draft --notes-file <notes> dist/ghbdtn-X.Y.Z.dmg
#   gh release edit vX.Y.Z --draft=false
#
# See docs/SECURITY.md for the full trust model.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only, and it stays read-only: nothing here writes to the repository or
# touches releases any more.
permissions:
  contents: read

jobs:
  verify-build:
    runs-on: macos-14        # Apple Silicon runner (matches the arm64 app)
    env:
      # Runner locale can be non-UTF-8, where bash 3.2 folds bytes of a
      # trailing "…" into a variable name ($VAR… → unbound). UTF-8 + braced
      # vars in the scripts both guard against it.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      # Actions are pinned to a commit SHA (not a moving @v4/@v2 major tag) so a
      # retagged/compromised action can't silently enter the pipeline.
      # The trailing comment records the version each SHA corresponds to.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Toolchain info
        run: swift --version && sw_vers

      # whisper.xcframework is pinned+checksummed in fetch-whisper.sh, so cache
      # it by that file's hash to avoid re-downloading ~48 MB every run.
      - name: Cache whisper.xcframework
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: Vendor
          key: whisper-${{ hashFiles('tools/fetch-whisper.sh') }}

      - name: Fetch whisper.xcframework
        run: ./tools/fetch-whisper.sh

      - name: Build
        run: swift build -c release

      - name: Regression checks
        run: .build/release/Ghbdtn --selftest

# NOTE: real Developer ID signing + notarization is still not wired in — that
# needs a paid Apple Developer account. Consequences, spelled out in
# docs/SECURITY.md: downloads stay quarantined (the one-time xattr step), and
# library validation cannot be enforced because a self-signed identity has no
# Team ID. The Hardened Runtime itself IS enabled.
